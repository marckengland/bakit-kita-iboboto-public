name: bakit-kita-iboboto-refreshed-release

# Local development services for Bakit Kita Iboboto.
#
#   docker compose up -d      # start PostgreSQL, Redis, Elasticsearch
#   docker compose down       # stop them (data is preserved in named volumes)
#   docker compose down -v    # stop and delete all data
#
# These match the defaults in .env.example. PostgreSQL is required; Redis and
# Elasticsearch are optional (the app degrades gracefully without them).

services:
  postgres:
    image: postgres:16
    container_name: bkib-refreshed-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bakit_kita_iboboto_refreshed
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: bkib-refreshed-redis
    ports:
      - "127.0.0.1:56381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: bkib-refreshed-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:59202:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
